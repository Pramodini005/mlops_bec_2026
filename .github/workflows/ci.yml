
name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: churn-api-housa-017

jobs:

  # ============================================================
  # JOB 1: TEST, TRAIN AND EVALUATE
  # ============================================================

  test-and-evaluate:
    name: Test and Evaluate Model
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

          # DVC 3.51.2 compatibility
          pip install --no-cache-dir --force-reinstall "pathspec==0.12.1"

      # --------------------------------------------------------
      # Verify Python/DVC environment
      # --------------------------------------------------------

      - name: Verify DVC environment
        run: |
          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python --version
          python -m pip --version

          echo ""
          echo "========================================"
          echo "DVC VERSION"
          echo "========================================"

          dvc --version

          echo ""
          echo "========================================"
          echo "PACKAGE VERSIONS"
          echo "========================================"

          python -m pip show dvc
          python -m pip show dvc-s3
          python -m pip show scmrepo
          python -m pip show pathspec

          echo ""
          echo "========================================"
          echo "PIP CHECK"
          echo "========================================"

          python -m pip check

          echo ""
          echo "========================================"
          echo "PATHSPEC IMPORT TEST"
          echo "========================================"

          python -c "import pathspec; print('pathspec:', pathspec.__version__)"
          python -c "from pathspec.patterns.gitwildmatch import _DIR_MARK; print('_DIR_MARK:', _DIR_MARK)"

      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Check DVC configuration
      # --------------------------------------------------------

      - name: Check DVC configuration
        run: |
          echo "========================================"
          echo "DVC VERSION"
          echo "========================================"

          dvc --version

          echo ""
          echo "========================================"
          echo "DVC REMOTES"
          echo "========================================"

          dvc remote list

          echo ""
          echo "========================================"
          echo "DVC DOCTOR"
          echo "========================================"

          dvc doctor

      # --------------------------------------------------------
      # Pull DVC data from Amazon S3
      # --------------------------------------------------------

      - name: Pull DVC data from S3
        run: |
          dvc pull -v

      # --------------------------------------------------------
      # Run unit tests
      # --------------------------------------------------------

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      # --------------------------------------------------------
      # Train model
      # --------------------------------------------------------

      - name: Train model
        run: |
          python src/train.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

      # --------------------------------------------------------
      # Verify model was created
      # --------------------------------------------------------

      - name: Verify trained model
        run: |
          echo "Checking model output..."

          if [ ! -f "models/best_model.pkl" ]; then
            echo "ERROR: models/best_model.pkl was not created."
            exit 1
          fi

          echo "Model found:"
          ls -lh models/best_model.pkl

      # --------------------------------------------------------
      # Evaluate model quality
      # --------------------------------------------------------

      - name: Evaluate model quality
        run: |
          python src/evaluate.py \
            --model_path models/best_model.pkl
        env:
          PYTHONPATH: ${{ github.workspace }}

      # --------------------------------------------------------
      # Push updated DVC artifacts
      # Only push from main
      # --------------------------------------------------------

      - name: Push updated artifacts to DVC remote
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dvc push


  # ============================================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  # ============================================================

  build-and-push:
    name: Build and Push Docker Image
    needs:
      - test-and-evaluate

    runs-on: ubuntu-latest

    # Only deploy after Job 1 succeeds
    # and only when pushing directly to main.
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Build and push Docker image
      # --------------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # --------------------------------------------------------
      # Deployment summary
      # --------------------------------------------------------

      - name: Deployment summary
        run: |
          echo "========================================"
          echo "IMAGE PUSH SUCCESSFUL"
          echo "========================================"

          echo "AWS Region:"
          echo "${{ env.AWS_REGION }}"

          echo ""
          echo "ECR Repository:"
          echo "${{ env.ECR_REPOSITORY }}"

          echo ""
          echo "Git SHA:"
          echo "${{ github.sha }}"

          echo ""
          echo "Docker images:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

